name: Fetch photos
on:
  push:
    paths: ["photos/wanted.txt", "scripts/fetch_photos.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: photos
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/fetch_photos.py
      - name: Commit new photos
        run: |
          git config user.name "ledger-photo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || (git commit -m "Add photos from Wikimedia Commons" && git push)

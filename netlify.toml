[build]
  publish = "public"
  command = "python3 build.py"
  # Only deploy when the site itself changes (editions or the builder). Photo-bot and other commits are skipped,
  # which saves Netlify credits (15 per production deploy on the free plan).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- editions/ build.py netlify.toml"
